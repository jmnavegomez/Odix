[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odix"]

[project]
name = "odix"
version = "0.0.1"
description = "An open-source publishing system for creating beautiful technical books from Markdown."
readme = "README.md"
requires-python = ">=3.12"

license = { text = "GPL-3.0-or-later" }

authors = [
    { name = "Jose Manuel Naveiro" }
]

keywords = [
    "books",
    "publishing",
    "documentation",
    "latex",
    "epub",
    "pdf",
    "html",
    "technical-writing"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing",
    "Topic :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "black>=25.0",
]

[project.urls]
Homepage = ""
Documentation = ""
Source = ""
Issues = ""

[project.scripts]
odix = "odix.cli:main"