[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/odix"]


[project]
name = "odix"
version = "0.1.2"
description = "An open-source publishing system for creating beautiful technical books from Markdown."
readme = "README.md"
requires-python = ">=3.12"

license = { file = "LICENSE" }

authors = [
    { name = "Jose Manuel Naveiro" }
]

dependencies = [
    "PyYAML>=6.0",
]

keywords = [
    "books",
    "publishing",
    "documentation",
    "latex",
    "pdf",
    "technical-writing",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing",
    "Topic :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "black>=25.0",
]


[project.urls]
Homepage = "https://github.com/jmnavegomez/Odix"
Documentation = "https://github.com/jmnavegomez/Odix/tree/main/docs"
Source = "https://github.com/jmnavegomez/Odix"
Issues = "https://github.com/jmnavegomez/Odix/issues"


[project.scripts]
odix = "odix.cli:main"

[tool.ruff.lint]
ignore = ["FLY002"]