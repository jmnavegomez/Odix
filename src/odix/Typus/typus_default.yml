document:
  class: book
  
  page:
    size: a5paper
    orientation: portrait

  margins:
    top: 2cm
    bottom: 2cm
    left: 2cm
    right: 2cm

  typography:
    font_size: 12pt
    line_spacing: 1.0
    font: "helvetica"

  layout:
    twoside: true
    chapters_start_on_odd_page: true
    table_of_contents: true

  numbering:
    pages: true
    position: top

  language: spanish

  packages:
    - inputenc
    - fontenc
    - graphicx
    - amsmath
    - listings